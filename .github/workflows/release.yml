name: Daily Release

on:
  schedule:
    # Daily at 07:00 UTC — one hour after the 06:00 UTC Daily Ingestion, so the
    # published exports always reflect the latest committed entries. This is the
    # delivery mechanism for the SIEM/CrowdStrike lookup feed (release assets).
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Build exports
        run: |
          python -m scripts.build_db
          python -m scripts.export_csv
          python -m scripts.stats

      - name: Create release tag
        id: tag
        run: echo "tag=v$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Web3 Threat Tracker ${{ steps.tag.outputs.tag }}"
          body: |
            Daily release of Web3 threat intelligence data.

            Lookup-feed assets for SIEM ingestion (CrowdStrike NG-SIEM / Splunk):
            - `malicious_only.csv` — all MALICIOUS-severity domains (the standard block/alert feed)
            - `high_confidence.csv` — only entries corroborated by 2+ sources (confidence = HIGH, lowest false positives)
            - `all_domains.csv` — full dataset; filter on `severity`/`confidence` in-query
            - `web3_tracker.db` — SQLite (indexed on `domain`) for local enrichment lookups

            `domain` is the first column in every CSV. See `stats.json` for the dataset summary.
          files: |
            data/exports/all_domains.csv
            data/exports/malicious_only.csv
            data/exports/high_confidence.csv
            data/exports/web3_tracker.db
            data/exports/stats.json
            labels/ofac.csv
